name: Scriblark Windows qualification
on:
  workflow_dispatch:
    inputs:
      capture_crash_stack:
        description: 'Diagnostic observer only; cannot confer consumer acceptance'
        type: boolean
        required: false
        default: false
  push:
    branches: [codex/inkquay]
permissions:
  contents: read
jobs:
  windows-x64:
    runs-on: windows-2025
    timeout-minutes: ${{ inputs.capture_crash_stack == true && 90 || 60 }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify native export input before the application build
        shell: pwsh
        run: ./script/msix/test_workflow_helpers.ps1
      - uses: ./.github/actions/install_deps_windows
        with:
          msystem: MINGW64
          msys_package_env: x86_64
      - name: Record exact installed input versions and package hashes
        run: |
          mkdir -p build-evidence
          git --version > build-evidence/git-version.txt
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          command -v git > build-evidence/git-executable.txt
          git config --show-origin --get-regexp '^core\.(autocrlf|eol|filemode)$' > build-evidence/git-checkout-config.txt || test "$?" -eq 1
          python - <<'PYTHON'
          import os
          from pathlib import Path
          import sys
          sys.path.insert(0, "script/msix")
          from prepare_inventory import require_clean_source
          require_clean_source(Path.cwd(), os.environ["GITHUB_SHA"], Path("build-evidence/source-status-before-build.json"))
          PYTHON
          pacman -Q > build-evidence/msys2-installed-packages.txt
          pacman -Qi > build-evidence/msys2-package-metadata.txt
          bash script/record-msys2-inputs.sh
          cmake --version > build-evidence/cmake-version.txt
          c++ --version > build-evidence/compiler-version.txt
      - name: Build private diagnostic GDB with corrected attach-thread shutdown policy
        if: ${{ inputs.capture_crash_stack == true }}
        continue-on-error: true
        timeout-minutes: 27
        run: bash script/msix/build-observer-gdb.sh
      - name: Configure qualified local-only features
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DENABLE_GTEST=ON -DDOWNLOAD_GTEST=OFF -DENABLE_CPPTRACE=OFF -DENABLE_AUDIO=OFF -DENABLE_PLUGINS=OFF -DENABLE_GTK_SOURCEVIEW=OFF
      - name: Build native application and test executables
        run: |
          cmake --build build --target pot translations --parallel 2
          cmake --build build --parallel 2
          cmake --build build --target test-units test-gtk-integration --parallel 2
      - name: Run real native and GTK tests
        timeout-minutes: 10
        run: ctest --test-dir build --timeout 60 --output-on-failure --output-junit "$PWD/build-evidence/tests.xml"
      - name: Stage application and native input inventory
        run: |
          python script/msix/test_prepare_inventory.py -v
          python script/test_inventoryWindows.py
          bash windows-setup/package.sh build
          cp build/inkquay-windows-inventory.json build-evidence/
          python -c 'import sys; print(sys.executable)' > build-evidence/python-executable.txt
          python script/msix/prepare_inventory.py --source-commit "$GITHUB_SHA"
      - name: Verify isolated packaged main window
        shell: pwsh
        run: ./script/test-packaged-startup.ps1
      - name: Qualify both fixed MSIX identities, actual workflow and owned cleanup
        shell: pwsh
        env:
          INKQUAY_CAPTURE_CRASH_STACK: ${{ inputs.capture_crash_stack == true && 'true' || 'false' }}
        run: ./script/msix/qualify-msix.ps1 -CaptureCrashStack:($env:INKQUAY_CAPTURE_CRASH_STACK -ceq 'true')
      - name: Preserve metadata only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Scriblark-Windows-qualification
          path: |
            build-evidence/*.json
            build-evidence/*.txt
            build-evidence/*.xml
            build-evidence/msix-install/*.json
            build-evidence/msix-install/*.png
            build-evidence/msix-install/*.txt
            build-evidence/msix-install/workflow/*.json
            build-evidence/msix-install/workflow/*.png
            build-evidence/msix-store-install/*.json
            build-evidence/msix-store-install/*.png
            build-evidence/msix-store-install/*.txt
            build-evidence/msix-store-install/workflow/*.json
            build-evidence/msix-store-install/workflow/*.png
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
          retention-days: 14
          if-no-files-found: error
      - name: Retain exact unsigned Store package and readiness receipt
        if: ${{ success() && inputs.capture_crash_stack != true }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Scriblark-Store-unsigned
          path: |
            build-evidence/store-ready/Scriblark_1.0.1.0_x64.msix
            build-evidence/store-ready/release-ready.json
          if-no-files-found: error
          retention-days: 14
